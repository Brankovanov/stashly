<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Choose a new Stashly password." />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Reset password — Stashly</title>
  </head>
  <body>
    <div id="app">
      <header id="site-header"></header>
      <main class="container py-5">
        <section class="auth-panel p-4 p-md-5 mx-auto">
          <p class="eyebrow mb-2">Account recovery</p>
          <h1 class="h2 fw-semibold mb-4">Choose a new password</h1>
          <p id="loading-state" class="craft-loader" role="status">Checking your reset link…</p>
          <div id="invalid-state" class="alert alert-warning" role="alert" hidden>
            This reset link is invalid or has expired.
            <a href="/pages/forgot-password.html">Request a new one</a>.
          </div>
          <form id="reset-form" hidden>
            <div class="mb-3">
              <label class="form-label" for="password">New password</label>
              <input
                class="form-control"
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="confirmPassword">Confirm new password</label>
              <input
                class="form-control"
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </div>
            <p class="text-danger" id="form-message" role="alert" aria-live="polite"></p>
            <button class="btn btn-primary w-100" type="submit">Update password</button>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="/src/pages/resetPassword.js"></script>
  </body>
</html>
