<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse and organize your embroidery supplies." />
    <meta name="theme-color" content="#f8f5ef" />
    <title>My supplies — Stashly</title>
    <style>
      /* Hide the unstyled page until main.css and the navbar are ready (src/components/loaders.js sets .app-ready). The 5s fallback reveals the page if scripts fail. */
      html { background: #f8f5ef; }
      html:not(.app-ready) body { visibility: hidden; animation: boot-reveal 0s 5s forwards; }
      html:not(.app-ready)::before { content: ""; position: fixed; top: 50%; left: 50%; width: 2.75rem; height: 2.75rem; margin: -1.4rem 0 0 -1.4rem; border-radius: 50%; background: #b96e68; animation: boot-spin 1s linear infinite, boot-hide 0s 5s forwards; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-reveal { to { visibility: visible; } }
      @keyframes boot-hide { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { html:not(.app-ready)::before { animation: boot-hide 0s 5s forwards; } }
    </style>  </head>
  <body>
    <div id="app">
      <header id="site-header"></header>
      <main class="container py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
          <div>
            <p class="eyebrow mb-2">Your inventory</p>
            <h1 class="display-6 fw-semibold mb-0">My supplies</h1>
          </div>
          <div class="d-flex align-items-center gap-3">
            <p class="text-muted mb-0" id="supply-count" aria-live="polite"></p>
            <a class="btn btn-primary" href="/pages/supply-form.html">
              <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add supply
            </a>
          </div>
        </div>

        <section class="filter-panel p-3 p-md-4 mb-4" aria-label="Filter supplies">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label" for="supply-search">Search</label>
              <input
                class="form-control"
                id="supply-search"
                type="search"
                placeholder="Name, brand, or color code"
                autocomplete="off"
              />
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label" for="category-filter">Category</label>
              <select class="form-select" id="category-filter">
                <option value="">All categories</option>
              </select>
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label" for="sort-supplies">Sort by</label>
              <select class="form-select" id="sort-supplies">
                <option value="name">Name (A–Z)</option>
                <option value="recent">Recently added</option>
                <option value="category">Category</option>
              </select>
            </div>
          </div>
        </section>

        <p class="craft-loader" id="loading-state" role="status">
          Loading your supplies…
        </p>
        <div class="alert alert-danger" id="error-state" role="alert" hidden></div>
        <div class="empty-state py-5 text-center" id="empty-state" hidden>
          <i class="bi bi-basket2 display-4 text-secondary" aria-hidden="true"></i>
          <h2 class="h4 mt-3">No supplies yet</h2>
          <p class="text-muted mb-0">
            Start your inventory by adding your first supply.
          </p>
          <a class="btn btn-primary mt-3" href="/pages/supply-form.html">Add your first supply</a>
        </div>
        <div class="empty-state py-5 text-center" id="no-results-state" hidden>
          <h2 class="h4">No matching supplies</h2>
          <p class="text-muted">Try a different search term or category.</p>
          <button class="btn btn-outline-secondary" id="clear-filters" type="button">
            Clear filters
          </button>
        </div>
        <div class="row g-3" id="supply-list" aria-live="polite"></div>
      </main>
    </div>
    <script type="module" src="/src/pages/supplies.js"></script>
  </body>
</html>
