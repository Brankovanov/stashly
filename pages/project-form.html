<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create or edit an embroidery project." />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Add project — Stashly</title>
  </head>
  <body>
    <div id="app">
      <header id="site-header"></header>
      <main class="container py-5">
        <section class="auth-panel project-form-panel p-4 p-md-5 mx-auto">
          <p class="eyebrow mb-2">Your creative plans</p>
          <h1 class="h2 fw-semibold mb-4" id="form-title">Add a project</h1>
          <p id="form-loading" class="text-muted" role="status">Loading project…</p>
          <div id="form-error" class="alert alert-danger" role="alert" hidden></div>
          <form id="project-form" hidden novalidate>
            <div class="mb-3">
              <label class="form-label" for="title">Title</label>
              <input
                class="form-control"
                id="title"
                name="title"
                type="text"
                maxlength="160"
                required
              />
              <div class="invalid-feedback">Enter a project title.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="description">Description</label>
              <textarea
                class="form-control"
                id="description"
                name="description"
                rows="5"
              ></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" for="status">Status</label>
              <select class="form-select" id="status" name="status" required>
                <option value="planned">Planned</option>
                <option value="in_progress">In progress</option>
                <option value="completed">Completed</option>
              </select>
              <div class="invalid-feedback">Choose a valid project status.</div>
            </div>
            <div id="form-message" role="status" aria-live="polite"></div>
            <div class="d-flex flex-column flex-sm-row gap-2">
              <button class="btn btn-primary" type="submit">Save project</button>
              <a class="btn btn-outline-secondary" href="/pages/projects.html">Cancel</a>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="/src/pages/projectForm.js"></script>
  </body>
</html>
