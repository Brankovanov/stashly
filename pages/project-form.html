<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create or edit an embroidery project." />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Add project — Stashly</title>
  </head>
  <body>
    <div id="app">
      <header id="site-header"></header>
      <main class="container py-5">
        <section class="auth-panel project-form-panel p-4 p-md-5 mx-auto">
          <p class="eyebrow mb-2">Your creative plans</p>
          <h1 class="h2 fw-semibold mb-4" id="form-title">Add a project</h1>
          <p id="form-loading" class="text-muted" role="status">Loading project…</p>
          <div id="form-error" class="alert alert-danger" role="alert" hidden></div>
          <form id="project-form" hidden novalidate>
            <div class="mb-3">
              <label class="form-label" for="title">Title</label>
              <input
                class="form-control"
                id="title"
                name="title"
                type="text"
                maxlength="160"
                required
              />
              <div class="invalid-feedback">Enter a project title.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="description">Description</label>
              <textarea
                class="form-control"
                id="description"
                name="description"
                rows="5"
              ></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" for="status">Status</label>
              <select class="form-select" id="status" name="status" required>
                <option value="planned">Planned</option>
                <option value="in_progress">In progress</option>
                <option value="completed">Completed</option>
              </select>
              <div class="invalid-feedback">Choose a valid project status.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="cover-file">Cover image (optional)</label>
              <input
                class="form-control"
                id="cover-file"
                name="cover_file"
                type="file"
                accept="image/jpeg,image/png,image/webp"
                aria-describedby="cover-help"
              />
              <div class="form-text" id="cover-help">JPG, PNG, or WebP; maximum 5 MB.</div>
              <div id="cover-preview" class="mt-3" hidden>
                <img class="project-file-preview" alt="" />
                <p class="small text-muted mb-0" data-preview-caption></p>
              </div>
              <div class="form-check mt-2" id="remove-cover-option" hidden>
                <input class="form-check-input" id="remove-cover" name="remove_cover" type="checkbox" />
                <label class="form-check-label" for="remove-cover">Remove current cover</label>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="pattern-file">Pattern file (optional)</label>
              <input
                class="form-control"
                id="pattern-file"
                name="pattern_file"
                type="file"
                accept="image/jpeg,image/png,image/webp,application/pdf"
                aria-describedby="pattern-help"
              />
              <div class="form-text" id="pattern-help">JPG, PNG, WebP, or PDF; maximum 10 MB.</div>
              <div id="pattern-preview" class="mt-3" hidden>
                <a class="d-inline-block mb-2" target="_blank" rel="noopener"></a>
                <img class="project-file-preview" alt="" hidden />
                <p class="small text-muted mb-0" data-preview-caption></p>
              </div>
              <div class="form-check mt-2" id="remove-pattern-option" hidden>
                <input class="form-check-input" id="remove-pattern" name="remove_pattern" type="checkbox" />
                <label class="form-check-label" for="remove-pattern">Remove current pattern file</label>
              </div>
            </div>
            <div id="form-message" role="status" aria-live="polite"></div>
            <div class="d-flex flex-column flex-sm-row gap-2">
              <button class="btn btn-primary" type="submit">Save project</button>
              <a class="btn btn-outline-secondary" href="/pages/projects.html">Cancel</a>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="/src/pages/projectForm.js"></script>
  </body>
</html>
