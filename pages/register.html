<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your Stashly account." />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Register — Stashly</title>
  </head>
  <body>
    <div id="app">
      <header id="site-header"></header>
      <main class="container py-5">
        <section class="auth-panel p-4 p-md-5 mx-auto">
          <p class="eyebrow mb-2">Start organizing</p>
          <h1 class="h2 fw-semibold mb-4">Create your account</h1>
          <form id="register-form">
            <div class="mb-3">
              <label class="form-label" for="display-name">Display name</label>
              <input
                class="form-control"
                id="display-name"
                name="displayName"
                type="text"
                autocomplete="name"
                maxlength="80"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input
                class="form-control"
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="confirm-password">Confirm password</label>
              <input
                class="form-control"
                id="confirm-password"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </div>
            <p class="text-danger" id="form-message" role="alert" aria-live="polite"></p>
            <button class="btn btn-primary w-100" type="submit">Create account</button>
          </form>
          <p class="mt-4 mb-0">
            Already registered? <a href="/pages/login.html">Log in</a>
          </p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/pages/register.js"></script>
  </body>
</html>
