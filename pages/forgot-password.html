<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Request a Stashly password reset link." />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Forgot password — Stashly</title>
    <style>
      /* Hide the unstyled page until main.css and the navbar are ready (src/components/loaders.js sets .app-ready). The 5s fallback reveals the page if scripts fail. */
      html { background: #f8f5ef; }
      html:not(.app-ready) body { visibility: hidden; animation: boot-reveal 0s 5s forwards; }
      html:not(.app-ready)::before { content: ""; position: fixed; top: 50%; left: 50%; width: 2.75rem; height: 2.75rem; margin: -1.4rem 0 0 -1.4rem; border-radius: 50%; background: #b96e68; animation: boot-spin 1s linear infinite, boot-hide 0s 5s forwards; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-reveal { to { visibility: visible; } }
      @keyframes boot-hide { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { html:not(.app-ready)::before { animation: boot-hide 0s 5s forwards; } }
    </style>  </head>
  <body>
    <div id="app">
      <header id="site-header"></header>
      <main class="container py-5">
        <section class="auth-panel p-4 p-md-5 mx-auto">
          <p class="eyebrow mb-2">Account recovery</p>
          <h1 class="h2 fw-semibold mb-3">Forgot your password?</h1>
          <p class="text-muted">Enter your email and we'll send you a link to choose a new password.</p>
          <form id="forgot-form">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <p class="text-danger" id="form-message" role="alert" aria-live="polite"></p>
            <button class="btn btn-primary w-100" type="submit">Send reset link</button>
          </form>
          <p class="mt-4 mb-0"><a href="/pages/login.html">Back to log in</a></p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/pages/forgotPassword.js"></script>
  </body>
</html>
