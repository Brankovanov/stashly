<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Request a Stashly password reset link." />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Forgot password — Stashly</title>
  </head>
  <body>
    <div id="app">
      <header id="site-header"></header>
      <main class="container py-5">
        <section class="auth-panel p-4 p-md-5 mx-auto">
          <p class="eyebrow mb-2">Account recovery</p>
          <h1 class="h2 fw-semibold mb-3">Forgot your password?</h1>
          <p class="text-muted">Enter your email and we'll send you a link to choose a new password.</p>
          <form id="forgot-form">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              />
            </div>
            <p class="text-danger" id="form-message" role="alert" aria-live="polite"></p>
            <button class="btn btn-primary w-100" type="submit">Send reset link</button>
          </form>
          <p class="mt-4 mb-0"><a href="/pages/login.html">Back to log in</a></p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/pages/forgotPassword.js"></script>
  </body>
</html>
